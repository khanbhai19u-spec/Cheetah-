name: Build APK
on:
  workflow_dispatch:
  push:
    branches: ['**']
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare project
        run: |
          mkdir -p www assets
          IDX=$(find . -type f -iname 'index.html' -not -path './node_modules/*' -not -path './android/*' -not -path './www/*' | head -n1)
          [ -z "$IDX" ] && IDX=$(find . -type f -iname '*.html' -not -path './node_modules/*' -not -path './android/*' -not -path './www/*' | head -n1)
          test -n "$IDX" || { echo "ERROR: upload index.html to the repo"; exit 1; }
          echo "Using $IDX"
          cp "$IDX" www/index.html
          PNG=$(find . -type f \( -iname '*.png' -o -iname '*.jpg' -o -iname '*.jpeg' \) -not -path './node_modules/*' -not -path './android/*' -not -path './www/*' -not -path './assets/*' | head -n1)
          if [ -n "$PNG" ]; then
            echo "Logo: $PNG"
            convert "$PNG" -resize 512x512 www/logo.png || cp "$PNG" www/logo.png
          else
            convert -size 512x512 xc:'#e50914' www/logo.png
          fi
          convert www/logo.png -resize 1024x1024! assets/icon-only.png || cp www/logo.png assets/icon-only.png
          cat > package.json <<'EOF'
          {
            "name": "cheetah",
            "version": "1.0.0",
            "private": true,
            "dependencies": {
              "@capacitor/android": "^6.1.2",
              "@capacitor/core": "^6.1.2"
            },
            "devDependencies": {
              "@capacitor/cli": "^6.1.2",
              "@capacitor/assets": "^3.0.5"
            }
          }
          EOF
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.cheetah.app",
            "appName": "Cheetah",
            "webDir": "www",
            "backgroundColor": "#0b0d12",
            "server": { "androidScheme": "https", "hostname": "localhost" }
          }
          EOF
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: npm install
      - run: npx cap add android
      - run: npx @capacitor/assets generate --android --iconBackgroundColor '#0b0d12' --iconBackgroundColorDark '#0b0d12'
        continue-on-error: true
      - run: npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Cheetah-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
