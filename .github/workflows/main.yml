name: Build Cheetah APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # If you uploaded cheetah-github-bundle.txt as-is, split it into real files.
      - name: Split bundle file
        run: |
          python3 - <<'PY'
          import glob, re, os
          for p in glob.glob('*.txt') + glob.glob('**/*.txt', recursive=True):
              t = open(p, encoding='utf-8').read()
              if '########## FILE: ' not in t:
                  continue
              parts = re.split(r'(?m)^########## FILE: (.+?) ##########\n', t)
              for i in range(1, len(parts), 2):
                  name = parts[i].strip()
                  if name.startswith('.github'):
                      continue
                  os.makedirs(os.path.dirname(name) or '.', exist_ok=True)
                  open(name, 'w', encoding='utf-8').write(parts[i + 1])
                  print('created', name)
              break
          PY
          # If no logo was uploaded, make a plain red placeholder so the build still works.
          python3 - <<'PY'
          import os, zlib, struct
          if not os.path.exists('assets/icon.png'):
              os.makedirs('assets', exist_ok=True)
              w = h = 512
              raw = (b'\x00' + bytes([229, 23, 43]) * w) * h
              def ch(t, d):
                  return struct.pack('>I', len(d)) + t + d + struct.pack('>I', zlib.crc32(t + d) & 0xffffffff)
              png = b'\x89PNG\r\n\x1a\n' + ch(b'IHDR', struct.pack('>IIBBBBB', w, h, 8, 2, 0, 0, 0)) + ch(b'IDAT', zlib.compress(raw)) + ch(b'IEND', b'')
              open('assets/icon.png', 'wb').write(png)
              print('placeholder icon created')
          PY

      # The repo only holds lib/, assets/ and pubspec.yaml.
      # The Android project (package com.cheetahapp) is generated here.
      - name: Generate Android project
        run: |
          cp -r lib /tmp/lib_bak
          flutter create . --org com --project-name cheetahapp --platforms android
          rm -rf lib && cp -r /tmp/lib_bak lib

      - name: Patch Android config
        run: |
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 23/; s/minSdkVersion flutter.minSdkVersion/minSdkVersion 23/' android/app/build.gradle* || true
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>\n    <application android:usesCleartextTraffic="true"#' $M
          sed -i 's/android:label="[^"]*"/android:label="Cheetah"/' $M

      - run: flutter pub get

      - name: App icon
        run: dart run flutter_launcher_icons

      - name: Build release APK
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: Cheetah-APK
          path: build/app/outputs/flutter-apk/app-release.apk
