name: Build APK
on:
  workflow_dispatch:
  push:
    branches: ['**']
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare project
        run: |
          python3 -m pip install -q --break-system-packages pillow || python3 -m pip install -q pillow || true
          python3 - <<'PY'
          import os, shutil, sys, zlib, struct
          skip = ('node_modules', 'android', 'www', 'assets', '.git')
          def find(exts):
              out = []
              for d, ds, fs in os.walk('.'):
                  ds[:] = [x for x in ds if x not in skip]
                  for f in fs:
                      if f.lower().endswith(exts):
                          out.append(os.path.join(d, f))
              return sorted(out, key=lambda p: (p.count('/'), p))
          idx = [p for p in find(('.html',)) if os.path.basename(p).lower() == 'index.html'] or find(('.html',))
          if not idx:
              sys.exit('ERROR: upload index.html to the repo')
          os.makedirs('www', exist_ok=True)
          os.makedirs('assets', exist_ok=True)
          shutil.copy(idx[0], 'www/index.html')
          print('Using', idx[0])
          def solid(path, n):
              raw = zlib.compress((b'\x00' + bytes([229, 9, 20]) * n) * n)
              def ch(t, d):
                  return struct.pack('>I', len(d)) + t + d + struct.pack('>I', zlib.crc32(t + d) & 0xffffffff)
              open(path, 'wb').write(b'\x89PNG\r\n\x1a\n' + ch(b'IHDR', struct.pack('>IIBBBBB', n, n, 8, 2, 0, 0, 0)) + ch(b'IDAT', raw) + ch(b'IEND', b''))
          imgs = find(('.png', '.jpg', '.jpeg'))
          if imgs:
              print('Logo:', imgs[0])
              try:
                  from PIL import Image
                  im = Image.open(imgs[0]).convert('RGB')
                  im.resize((512, 512)).save('www/logo.png')
                  im.resize((1024, 1024)).save('assets/icon-only.png')
              except Exception as e:
                  print('Pillow not used:', e)
                  shutil.copy(imgs[0], 'www/logo.png')
                  shutil.copy(imgs[0], 'assets/icon-only.png')
          else:
              print('No logo image found, using plain red icon')
              solid('www/logo.png', 512)
              solid('assets/icon-only.png', 1024)
          PY
          cat > package.json <<'EOF'
          {
            "name": "cheetah",
            "version": "1.0.0",
            "private": true,
            "dependencies": {
              "@capacitor/android": "^6.1.2",
              "@capacitor/core": "^6.1.2"
            },
            "devDependencies": {
              "@capacitor/cli": "^6.1.2",
              "@capacitor/assets": "^3.0.5"
            }
          }
          EOF
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.cheetah.app",
            "appName": "Cheetah",
            "webDir": "www",
            "backgroundColor": "#0b0d12",
            "server": { "androidScheme": "https", "hostname": "localhost" }
          }
          EOF
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: npm install
      - run: npx cap add android
      - run: npx @capacitor/assets generate --android --iconBackgroundColor '#0b0d12' --iconBackgroundColorDark '#0b0d12'
        continue-on-error: true
      - run: npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Cheetah-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
