<script>(()=>{
// ===== SETTINGS: paste your TMDB key here =====
const TMDB_KEY="17509a46d9802f1f5b73bf7b9d8bad7c";
const FS="https://firestore.googleapis.com/v1/projects/cheetah-70c03/databases/(default)/documents/",AK="AIzaSyDTGwyd1AK62ZeMiv1MZ0SseCZAsBqbd9U";

const dv=v=>{if("stringValue"in v)return v.stringValue;if("integerValue"in v)return +v.integerValue;if("doubleValue"in v)return v.doubleValue;if("booleanValue"in v)return v.booleanValue;if("timestampValue"in v)return{seconds:Math.floor(Date.parse(v.timestampValue)/1000)};if("arrayValue"in v)return(v.arrayValue.values||[]).map(dv);if("mapValue"in v)return mf(v.mapValue.fields);return null};
async function col(c){const out=[];let t="";do{const r=await fetch(FS+c+"?pageSize=300&key="+AK+(t?"&pageToken="+encodeURIComponent(t):""));const j=await r.json();if(!r.ok)throw new Error(j.error&&j.error.message||r.status);(j.documents||[]).forEach(d=>out.push({id:d.name.split("/").pop(),...mf(d.fields)}));t=j.nextPageToken||""}while(t);return out}

let items=[],ads=[],nots=[],tab="home",type="all",genre="",q="",favs=ls("fav",[]),seen=ls("seen",0),so="new",feat=[],hi=0,cw=ls("cw",[]),lastEp=ls("le",{}),epc={};

async function load(){
  try{
    const a=[];for(const c of ["movies","series"])(await col(c)).forEach(d=>a.push(d));
    const t=x=>(x.approvedAt||x.createdAt)?.seconds||0;items=a.sort((x,y)=>t(y)-t(x));

function play(n,s,e,srv=dsv){

  if(n.manual){
    if(n.videoType==="youtube")url=`https://www.youtube.com/embed/${n.youtubeId}?autoplay=1`;
    else if(n.videoType==="facebook")url=`https://www.facebook.com/plugins/video.php?href=${encodeURIComponent(n.videoUrl)}&show_text=false&autoplay=true`;
    else direct=n.videoUrl;
  }else url=SRV[srv][1](n,s,e);
  const sub=n.type==="tv"?` · S${s} E${e}`:"";
  p.innerHTML=`<div class="top"><button class="ib" id="pb">${ic('<path d="M15 18l-6-6 6-6"/>')}</button><b>${esc(n.title+sub)}</b><button class="ib" id="ct">${ic('<path d="M2 8V6a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-6M2 12a9 9 0 0 1 8 8M2 16a5 5 0 0 1 4 4M2 20h.01"/>')}</button></div>
  <div class="vb">${direct?`<video id="vv" controls autoplay playsinline src="${esc(direct)}"></video>`:`<iframe src="${esc(url)}" allow="autoplay; fullscreen; encrypted-media; picture-in-picture" allowfullscreen referrerpolicy="origin"></iframe>`}</div>
  <div class="srv" style="padding-bottom:0"><button class="chip" data-pa="fs">Fullscreen</button>${direct?'<button class="chip" data-pa="pip">Picture in picture</button>':""}<button class="chip" data-pa="rp">Report problem</button></div>
  ${n.manual?"":`<div class="srv">${Object.entries(SRV).map(([k,v])=>`<button class="chip ${k===srv?"on":""}" data-sv="${k}">${v[0]}</button>`).join("")}${n.type==="tv"&&e<(epc[K(n)+"_"+s]||999)?`<button class="chip" data-nx="1">Next episode ></button>`:""}<small style="color:var(--mu);width:100%">Video not loading? Try the other server.</small></div>`}
  ${adHtml("Player")}`;
  show(p);
  $("pb").onclick=()=>history.back();
  p.querySelectorAll("[data-sv]").forEach(b=>b.onclick=()=>play(n,s,e,b.dataset.sv));p.querySelectorAll("[data-pa]").forEach(b=>b.onclick=async()=>{const a=b.dataset.pa;if(a==="fs"){try{await p.querySelector(".vb").requestFullscreen();if(screen.orientation&&screen.orientation.lock)screen.orientation.lock("landscape").catch(()=>{})}catch{toast("Fullscreen not supported")}}else if(a==="pip"){try{await p.querySelector("video").requestPictureInPicture()}catch{toast("PiP not supported")}}else report(n,s,e,srv)});
  const nx=p.querySelector("[data-nx]");if(nx)nx.onclick=()=>play(n,s,e+1,srv);

    }catch(x){if(x&&x.name==="NotAllowedError")return;if(x&&x.name==="NotFoundError")return toast("No TV found on this Wi-Fi")}
    toast("Use your phone Cast / Smart View screen mirroring");
  };
}

 const fb=e.target.closest("[data-fv]");if(fb){const k=fb.dataset.fv;favs=favs.includes(k)?favs.filter(x=>x!==k):[...favs,k];save();toast(favs.includes(k)?"Added to My List":"Removed");return}
 const go=e.target.closest("[data-go]");if(go){tab=go.dataset.go;render();return}
 const qc=e.target.closest("[data-qc]");if(qc){const v=qc.dataset.qc;tab="cat";type=v==="movie"||v==="tv"?v:"all";genre=type==="all"?v:"";so="new";lf="";mr=0;scrollTo(0,0);render();return}
 const s2=e.target.closest("[data-sv2]");if(s2){dsv=s2.dataset.sv2;sv("srv",dsv);render();return}
 const lc=e.target.closest("[data-lt]");if(lc){lt=lc.dataset.lt;render();return}const sa=e.target.closest("[data-sa]");if(sa){const v=sa.dataset.sa;tab="cat";so=v==="top"?"top":"new";type=v==="movie"||v==="tv"?v:"all";genre="";lf="";mr=0;scrollTo(0,0);render();return}const rc=e.target.closest("[data-rs]");if(rc){q=rc.dataset.rs;render();return}const b=e.target.closest("[data-ac]");if(!b)return;const a=b.dataset.ac;
 if(a==="srv"){dsv=dsv==="vidlink"?"vidsrc":"vidlink";sv("srv",dsv);render();toast("Default server: "+SRV[dsv][0])}
 else if(a==="in")loginUI();
 else if(a==="out"){U=null;sv("u",null);sv("gst",0);render();loginUI()}
 else if(a==="req"){if(!U)return toast("Sign in first");const t=(prompt("Which movie or series do you want?")||"").trim();if(t)try{await post("requests",{title:t,uid:U.uid,email:U.email});toast("Request sent")}catch(x){toast(x.message)}}
 else if(a==="share")shr("movies");
 else if(a==="rate"){RATE?open(RATE,"_blank"):toast("Rate link not set yet")}
 else if(a==="privacy")info("Privacy policy","Cheetah stores your email and your saved list on your account only. We do not sell your data. Videos come from third-party sources and are not hosted by us.");
 else if(a==="about")info("About","Cheetah v"+APP_VER+". Movie data and images by TMDB. This product uses the TMDB API but is not endorsed or certified by TMDB.");
 else if(a==="clh"){cw=[];lastEp={};save();render();toast("History cleared")}
 else if(a==="clc"){if(window.caches)(await caches.keys()).forEach(k=>caches.delete(k));toast("Cache cleared")}});
setInterval(async()=>{try{const a=await col("notifications");a.sort((x,y)=>(y.createdAt?.seconds||0)-(x.createdAt?.seconds||0));const top=nots[0]?.createdAt?.seconds||0;if(a[0]&&(a[0].createdAt?.seconds||0)>top){nots=a;badge();toast("🔔 "+a[0].title)}}catch{}},90000);
addEventListener("fullscreenchange",()=>{if(!document.fullscreenElement&&screen.orientation&&screen.orientation.unlock)screen.orientation.unlock()});
function heroSet(i){const f=feat[i];if(!f||!$("himg"))return;$("himg").src=f.poster||f.backdrop;$("hh").textContent=f.title;$("hmt").textContent=`${f.year} · ★ ${(+f.rating||0).toFixed(1)} · ${f.type==="tv"?"Series":"Movie"}`;const k=K(f);$("hp").dataset.k=k;document.querySelector(".wp").dataset.pl=k;document.querySelector(".wl").dataset.fv=k;document.querySelector(".wi").dataset.k=k;document.querySelectorAll(".dt i").forEach((d,j)=>d.classList.toggle("on",j===i))}
const sres=()=>q?grid(flt()):`<h3>🔥 Popular on Cheetah</h3>`+grid([...items].sort((a,b)=>(b.rating||0)-(a.rating||0)).slice(0,18));
const show=el=>{if(!el.classList.contains("on")){el.classList.add("on");history.pushState(1,"")}};
addEventListener("popstate",()=>{const p=$("pl");if(p.classList.contains("on")){p.classList.remove("on");p.innerHTML=""}else $("dt").classList.remove("on")});
setInterval(()=>{if(!$("hr")||feat.length<2||tab!=="home")return;hi=(hi+1)%feat.length;heroSet(hi)},5000);
$("mn").innerHTML='<div class="grid">'+'<div class="sk"></div>'.repeat(6)+'</div>';
if(U)pull().then(render);else if(!ls("gst",0))loginUI();
load();
})();
